events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;

    # Shared TLS settings (certificates from certbot, mounted at /etc/letsencrypt)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ------------------------------------------------------------------
    # Explore/Archive site
    # ------------------------------------------------------------------

    # HTTP: answer Let's Encrypt challenges, redirect everything else to HTTPS
    server {
        listen 80;
        server_name explore.toynbeehall.org.uk staging.explore.toynbeehall.org.uk;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS (staging)
    server {
        listen 443 ssl;
        http2 on;
        server_name staging.explore.toynbeehall.org.uk;

        ssl_certificate     /etc/letsencrypt/live/staging.explore.toynbeehall.org.uk/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/staging.explore.toynbeehall.org.uk/privkey.pem;

        root /var/www/explore;
        index index.html;

        location / {
            try_files $uri $uri/ $uri.html =404;
        }

        # Cache static assets
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ------------------------------------------------------------------
    # Main Toynbee Hall site (Next.js)
    # ------------------------------------------------------------------

    # HTTP (staging): answer Let's Encrypt challenges, redirect everything else to HTTPS
    server {
        listen 80;
        server_name staging.toynbeehall.org.uk;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS (staging)
    server {
        listen 443 ssl;
        http2 on;
        server_name staging.toynbeehall.org.uk;

        ssl_certificate     /etc/letsencrypt/live/staging.toynbeehall.org.uk/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/staging.toynbeehall.org.uk/privkey.pem;

        location / {
            proxy_pass http://nextjs:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # HTTP default server for all other requests (production hostnames, bare IP)
    server {
        listen 80 default_server;
        server_name toynbeehall.org.uk www.toynbeehall.org.uk;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            proxy_pass http://nextjs:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
