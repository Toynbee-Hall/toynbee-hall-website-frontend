services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: toynbee-nextjs
    restart: always
    environment:
      NODE_ENV: production
    networks:
      - toynbee-network

  nginx:
    image: nginx:alpine
    container_name: toynbee-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /var/www/toynbee/explore-toynbee-hall:/var/www/explore:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - nextjs
    networks:
      - toynbee-network

  certbot:
    image: certbot/certbot
    container_name: toynbee-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  toynbee-network:
    driver: bridge
